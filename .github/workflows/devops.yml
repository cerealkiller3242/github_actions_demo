name: CI/CD Pipeline Avanzado
run-name: "Pipeline ejecutado por ${{ github.actor }} en ${{ github.ref_name }}"

on:
  push:
    branches: [ main, develop, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Permite ejecución manual

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    outputs:
      build_tag: ${{ steps.meta.outputs.tag }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-
            pip-${{ runner.os }}-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov
      
      - name: Run tests with coverage
        run: |
          export PYTHONPATH="${PYTHONPATH}:$(pwd)"
          pytest -q --junitxml=report.xml \
            --cov=hello \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html \
            --cov-fail-under=80
      
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-py${{ matrix.python-version }}
          path: |
            report.xml
            coverage.xml
            htmlcov/
          if-no-files-found: error
      
      - name: Compute build tag
        id: meta
        if: always()
        run: |
          TS=$(date +%Y%m%d-%H%M%S)
          echo "tag=${TS}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publish test summary
        if: always()
        run: |
          TESTS=$(python -c "import xml.etree.ElementTree as ET; print(ET.parse('report.xml').getroot().get('tests', 'n/a'))")
          FAILURES=$(python -c "import xml.etree.ElementTree as ET; print(ET.parse('report.xml').getroot().get('failures', 'n/a'))")
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; print(f\"{float(ET.parse('coverage.xml').getroot().get('line-rate', 0)) * 100:.0f}%\")")
          {
            echo "## Test summary (Python ${{ matrix.python-version }})"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Build tag | \`${{ steps.meta.outputs.tag }}\` |"
            echo "| Tests | ${TESTS} |"
            echo "| Fallos | ${FAILURES} |"
            echo "| Cobertura | ${COVERAGE} (mínimo 80%) |"
            echo "| Estado | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  docs:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Show pipeline information
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Runner: $RUNNER_OS"

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Create package
        run: |
          mkdir -p dist
          cp hello.py dist/
          zip -r "app-${{ needs.test.outputs.build_tag }}.zip" dist/.
          mv "app-${{ needs.test.outputs.build_tag }}.zip" dist/
      
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: dist/*.zip
          retention-days: 30

  deploy:
    needs: [test, package, docs]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Render page
        env:
          BUILD_TAG: ${{ needs.test.outputs.build_tag }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          mkdir -p public
          export APP_OUTPUT=$(python hello.py)
          sed \
            -e "s|__BUILD_TAG__|${BUILD_TAG}|g" \
            -e "s|__COMMIT_SHORT__|${GITHUB_SHA::7}|g" \
            -e "s|__COMMIT_URL__|${COMMIT_URL}|g" \
            -e "s|__BRANCH__|${GITHUB_REF_NAME}|g" \
            -e "s|__ACTOR__|${GITHUB_ACTOR}|g" \
            -e "s|__DATE__|$(date -u '+%Y-%m-%d %H:%M:%S')|g" \
            -e "s|__RUN_URL__|${RUN_URL}|g" \
            -e "s|__RUN_NUMBER__|${GITHUB_RUN_NUMBER}|g" \
            -e "s|__REPO_URL__|${REPO_URL}|g" \
            site/index.html > public/index.html
          python - <<'PY'
          import os
          import pathlib

          page = pathlib.Path("public/index.html")
          page.write_text(page.read_text().replace("__APP_OUTPUT__", os.environ["APP_OUTPUT"]))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4